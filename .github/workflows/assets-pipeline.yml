name: Asset pipeline

# Owner-supplied source GLBs are downloaded here (they are never committed) and
# optimized into public/. This runs on GitHub's runners because the source host
# is not reachable from every environment the project is developed in.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'inspect = reports only, build = reports + optimized public assets'
        required: true
        default: build
        type: choice
        options:
          - build
          - inspect
      only:
        description: 'Optional single asset id (sikandar-suv | aurora-v12 | forest-dirt-trail)'
        required: false
        default: ''
        type: string
  # Rebuilds whenever the pipeline itself changes (the source GLBs are not in
  # the repository, so this is the only way to reproduce the shipped output).
  push:
    paths:
      - '.github/workflows/assets-pipeline.yml'
      - 'scripts/assets/**'

permissions:
  contents: write

concurrency:
  group: assets-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PIPELINE_MODE: ${{ github.event.inputs.mode || 'build' }}
      PIPELINE_ONLY: ${{ github.event.inputs.only || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch source models into assets/raw (ignored, never committed)
        run: node scripts/assets/fetch-sources.mjs ${{ env.PIPELINE_ONLY != '' && format('--only {0}', env.PIPELINE_ONLY) || '' }}

      - name: Inspect sources (node tree, wheel candidates, occupancy maps)
        run: node scripts/assets/inspect-glb.mjs

      - name: Optimize GLBs into public/
        if: env.PIPELINE_MODE != 'inspect'
        run: node scripts/assets/optimize-glb.mjs ${{ env.PIPELINE_ONLY != '' && format('--only {0}', env.PIPELINE_ONLY) || '' }}

      - name: Fetch Poly Haven CC0 asphalt PBR (2K)
        if: env.PIPELINE_MODE != 'inspect'
        run: node scripts/assets/fetch-environment.mjs

      - name: Generate CC0 engine loops
        if: env.PIPELINE_MODE != 'inspect'
        run: node scripts/assets/build-audio.mjs

      - name: Report sizes
        if: always()
        run: |
          echo "## Pipeline output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -h -d 2 public 2>/dev/null | sort -h >> $GITHUB_STEP_SUMMARY || true
          ls -la public/models public/tracks public/textures public/audio 2>/dev/null >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Commit pipeline output
        run: |
          git config user.name "maxmotors-asset-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A assets/reports public
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(assets): pipeline output (${{ env.PIPELINE_MODE }}) [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
